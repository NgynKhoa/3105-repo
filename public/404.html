<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 — 3105-repo</title>
  <style>
    :root { --bg: #06060e; --text: #c0d8cc; --neon: #39ff14; --neon-rgb: 57, 255, 20; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; }
    .wrap { text-align: center; padding: 24px; max-width: 540px; }
    h1 { font-size: 5rem; color: var(--neon); text-shadow: 0 0 14px rgba(var(--neon-rgb), 0.6); margin-bottom: 16px; }
    h2 { color: var(--text); margin-bottom: 12px; font-weight: 600; }
    p { color: #7a9a86; margin-bottom: 24px; line-height: 1.6; }
    a { display: inline-block; padding: 10px 22px; background: rgba(var(--neon-rgb), 0.1); border: 1px solid var(--neon); color: var(--neon); border-radius: 4px; text-decoration: none; font-weight: 600; transition: all 0.15s; }
    a:hover { background: var(--neon); color: #000; box-shadow: 0 0 16px rgba(var(--neon-rgb), 0.7); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Trang không tồn tại</h2>
    <p>Repo này là trang <b>read-only</b> của 3105-repo. Nếu bạn là dev patch và cần chỉnh sửa, hãy dùng admin dashboard local hoặc IDE + GitHub.</p>

  </div>
</body>
</html>
