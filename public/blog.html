<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="./">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <title>Blog — 3105 Mod Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fira+Code:wght@400;500&family=Be+Vietnam+Pro:wght@300;400;500;600&family=VT323&display=swap" rel="stylesheet" />
  <style>
    /* === FPS overlay widget (đồng bộ style với Front Repo) === */
    #fps-box {
      position: fixed;
      top: 6px;
      left: 6px;
      z-index: 999999;
      padding: 0;
      font-family: 'VT323', 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1;
      color: #39ff14;
      background: transparent;
      border: none;
      pointer-events: none;
      text-shadow: 0 0 4px currentColor;
      letter-spacing: 1px;
      user-select: none;
    }

    /* ============================ CSS VARIABLES ============================ */
    :root {
      --neon: #80ff40;
      --neon-rgb: 57, 255, 20;
      --neon-pink: #ff2d7b;
      --neon-pink-rgb: 255, 45, 123;
      --neon-cyan: #00f0ff;
      --neon-cyan-rgb: 0, 240, 255;
      --neon-yellow: #f0e040;
      --neon-lavender: #b388ff;
      --bg: #06060e;
      --panel: rgba(10, 14, 26, 0.92);
      --panel-alt: rgba(6, 9, 18, 0.96);
      --panel-alpha: 0.92;
      --text: #c0d8cc;
      --text-bright: #e8fff0;
      --muted: #7a9a86;
      --border: rgba(57, 255, 20, 0.15);
      --border-glow: rgba(57, 255, 20, 0.38);
      --shadow: 0 0 14px rgba(0,0,0,0.4), 0 0 28px rgba(var(--neon-rgb),0.08);
    }

    /* ============================ RESET & BASE ============================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Be Vietnam Pro', 'Fira Code', 'Courier New', monospace;
      min-height: 100vh;
      /* text-shadow nhẹ chỉ cho nav/heading; post-body sẽ tự override text-shadow:none */
      text-shadow: 0 0 4px rgba(232,255,240,0.3), 0 0 8px rgba(var(--neon-rgb),0.1);
      overflow-x: hidden;
      position: relative;
    }
    /* Tắt text-shadow cho body khi đang ở chế độ đọc bài viết (post-detail)
       — shadow làm chữ nhỏ 14-16px bị nhòe, khó đọc */
    body.reading-mode { text-shadow: none; }

    /* CRT scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.04) 2px, rgba(0, 0, 0, 0.04) 4px);
    }

    /* Background grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0 1px, transparent 1px 44px),
        radial-gradient(circle at 15% 8%, rgba(0,240,255,0.06), transparent 28%),
        radial-gradient(circle at 85% 4%, rgba(255,45,123,0.05), transparent 22%);
    }

    /* ============================ RAIN EFFECT ============================ */
    #rain-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ============================ LAYOUT ============================ */
    .page-wrapper {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ============================ HEADER ============================ */
    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--neon);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      text-decoration: none;
    }
    /* Arrow SVG icon — sits centered inside flex containers. */
    .back-btn .back-arrow,
    .post-back-link .back-arrow {
      display: inline-block;
      flex-shrink: 0;
      color: currentColor;
    }
    /* Tiny nudges for visual baseline alignment with the text next to it. */
    .back-btn .back-arrow { margin-top: -1px; }
    .post-back-link .back-arrow { transform: translateY(1px); }
    .back-btn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 10px rgba(var(--neon-rgb),0.3);
      transform: translateX(-2px);
    }
    .page-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--neon);
      text-shadow: 0 0 8px rgba(var(--neon-rgb),0.5), 0 0 20px rgba(var(--neon-rgb),0.2);
      letter-spacing: 1px;
    }
    .page-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ============================ BLOG LIST ============================ */
    .blog-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .blog-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .blog-card:hover {
      border-color: var(--border-glow);
      box-shadow: var(--shadow);
      transform: translateX(4px);
      background: rgba(10, 14, 26, 0.98);
    }
    .blog-card-icon {
      font-size: 26px;
      flex-shrink: 0;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-alt);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .blog-card-content {
      flex: 1;
      min-width: 0;
    }
    .blog-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .blog-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .blog-card-excerpt {
      font-size: 12px;
      color: var(--text);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .blog-card-arrow {
      color: var(--neon);
      font-size: 18px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .blog-card:hover .blog-card-arrow {
      opacity: 1;
    }

    /* ============================ SINGLE POST ============================ */
    .post-detail {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .post-header {
      padding: 26px 26px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(var(--neon-rgb),0.04) 0%, transparent 100%);
    }
    .post-title {
      font-family: 'Be Vietnam Pro', 'Fira Code', 'Courier New', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-bright);
      line-height: 1.35;
      margin-bottom: 10px;
      text-shadow: none;
      letter-spacing: 0.2px;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      font-family: 'Be Vietnam Pro', 'Fira Code', 'Courier New', monospace;
      color: var(--muted);
    }
    .post-back-link {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-size: 13px;
      font-family: 'Be Vietnam Pro', 'Fira Code', 'Courier New', monospace;
      color: var(--neon);
      text-decoration: none;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    /* Arrow character ← has descender in fallback fonts that pushes it down —
       pull it up a few pixels so it sits on the same baseline as the text. */
    .post-back-link .back-arrow {
      /* SVG: already styled above. Override the older span version that
         some places might still use. */
      display: inline-block;
      width: 1em;
      line-height: 1;
      transform: translateY(0);
    }
    .post-back-link:hover {
      text-shadow: 0 0 8px rgba(var(--neon-rgb),0.5);
    }
    .post-icon-big {
      font-size: 52px;
      line-height: 1;
      margin-bottom: 14px;
      font-family: 'Be Vietnam Pro', 'Fira Code', 'Courier New', monospace;
    }
      color: var(--muted);
    }
    .post-body {
      padding: 32px 40px 36px;
      line-height: 1.85;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.2px;
      /* KHÔNG dùng text-shadow ở body chính — gây nhòe khó đọc */
      text-shadow: none;
    }
    .post-body > *:first-child { margin-top: 0; }
    .post-body > *:last-child { margin-bottom: 0; }
    /* Khi post.content được paste từ textarea thẳng (không có HTML block),
       text thường bị wrap sát mép trái → bỏ text-indent và cho padding-left
       dư phòng các block chưa được wrap bởi <p> khi user save từ dashboard. */
    .post-body { padding-left: max(40px, 6%); }
    @media (max-width: 600px) {
      .post-body { padding: 22px 18px 26px; }
    }
    .post-body img,
    .post-body figure {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin: 18px 0;
      display: block;
    }
    .post-body figure { margin: 22px 0; }
    .post-body figure img { margin: 0; }
    .post-body figcaption {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      font-style: italic;
    }
    .post-body .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }
    .post-body .image-gallery img {
      margin: 0;
      width: 100%;
      object-fit: cover;
      aspect-ratio: 16 / 10;
    }
    .post-hero-img {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin: 0 0 18px;
      display: block;
      background: var(--panel-alt);
    }
    .post-body h2 {
      color: var(--neon);
      font-size: 19px;
      margin: 28px 0 12px;
      font-weight: 700;
      line-height: 1.35;
      text-shadow: none;
    }
    .post-body h2:first-child { margin-top: 0; }
    .post-body h3 {
      color: var(--neon-cyan);
      font-size: 16px;
      margin: 22px 0 10px;
      font-weight: 600;
      text-shadow: none;
    }
    .post-body h4 {
      color: var(--neon-pink);
      font-size: 15px;
      margin: 18px 0 8px;
      font-weight: 600;
      text-shadow: none;
    }
    .post-body p {
      margin-bottom: 14px;
      color: var(--text-bright);
      text-shadow: none;
    }
    .post-body ul, .post-body ol {
      margin: 12px 0 16px 22px;
    }
    .post-body li {
      margin-bottom: 8px;
      color: var(--text-bright);
      line-height: 1.75;
      text-shadow: none;
    }
    .post-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 14px;
    }
    .post-body th, .post-body td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .post-body th {
      background: rgba(var(--neon-rgb),0.08);
      color: var(--neon);
      font-weight: 600;
    }
    .post-body strong {
      color: var(--neon-yellow);
      font-weight: 600;
    }
    .post-body em {
      color: var(--neon-cyan);
      font-style: italic;
    }
    .post-body a {
      color: var(--neon);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .post-body a:hover {
      color: var(--neon-pink);
    }
    .post-body code {
      background: rgba(var(--neon-rgb),0.08);
      color: var(--neon);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
    }
    .post-body pre {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-left: 3px solid var(--neon);
      padding: 14px 18px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 14px 0;
    }
    .post-body pre code {
      background: transparent;
      padding: 0;
      color: var(--text-bright);
      font-size: 13px;
    }
    .post-body blockquote {
      border-left: 3px solid var(--neon);
      padding: 10px 16px;
      margin: 14px 0;
      background: rgba(var(--neon-rgb),0.04);
      color: var(--text);
      font-style: italic;
    }

    /* ============================ PAGINATION ============================ */
    .blog-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    .page-btn {
      min-width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .page-btn:hover, .page-btn.active {
      border-color: var(--neon);
      color: var(--neon);
      box-shadow: 0 0 10px rgba(var(--neon-rgb),0.25);
    }
    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ============================ SETTINGS BUTTON ============================ */
    #settingsBtn {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10000;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--neon);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    #settingsBtn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 14px rgba(var(--neon-rgb),0.35);
      transform: rotate(30deg);
    }

    /* ============================ SETTINGS MENU ============================ */
    #settingsMenu {
      display: none;
      position: fixed;
      top: 60px;
      right: 14px;
      z-index: 10001;
      width: 250px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    #settingsMenu.open { display: block; }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(var(--neon-rgb),0.04);
    }
    .settings-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: var(--neon);
      text-shadow: 0 0 6px rgba(var(--neon-rgb),0.4);
    }
    .settings-close {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .settings-close:hover {
      color: var(--neon-pink);
      background: rgba(var(--neon-pink-rgb),0.1);
    }
    .settings-body { padding: 6px 0; max-height: 65vh; overflow-y: auto; }
    .settings-group { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .settings-group:last-child { border-bottom: none; }
    .settings-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-row-label { font-size: 12px; color: var(--text); }
    .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .theme-btn {
      height: 34px;
      border: 2px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn:hover { transform: scale(1.05); }
    .theme-btn.active { border-color: var(--neon); box-shadow: 0 0 10px rgba(var(--neon-rgb),0.3); }
    input[type="range"] {
      width: 100%;
      height: 5px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--neon);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(var(--neon-rgb),0.5);
    }
    .toggle-switch { position: relative; width: 42px; height: 22px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: var(--muted);
      border-radius: 50%;
      transition: all 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: rgba(var(--neon-rgb),0.2);
      border-color: var(--neon);
    }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(20px);
      background: var(--neon);
      box-shadow: 0 0 8px rgba(var(--neon-rgb),0.5);
    }

    /* ============================ NOW PLAYING (blog page mini player) ============================ */
    #mpPlayer {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 9500;
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4), 0 0 10px rgba(var(--neon-rgb), 0.25);
      font-family: 'VT323', monospace;
      color: var(--text);
      min-width: 320px;
      max-width: 380px;
    }
    #mpPlayer:not(.hide) { display: flex; }
    /* 2 rows */
    #mpPlayer .mp-row { display: flex; align-items: center; gap: 8px; }
    #mpPlayer .mp-row-top { gap: 10px; }
    #mpPlayer .mp-row-bot { gap: 6px; }
    /* Disc (vuông cover) — lớn để nổi bật */
    #mpPlayer .mp-disc {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(var(--neon-rgb), 0.15);
      background-size: cover; background-position: center;
      flex-shrink: 0;
      border: 1px solid rgba(var(--neon-rgb), 0.45);
      position: relative;
      overflow: hidden;
    }
    #mpPlayer .mp-disc::after {
      content: '';
      position: absolute; inset: 30%;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 4px var(--neon);
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    #mpPlayer .mp-disc.has-image::after { opacity: 0; }
    #mpPlayer .mp-disc.has-image { border-color: rgba(var(--neon-rgb), 0.7); }
    #mpPlayer.playing .mp-disc { animation: mp-spin 6s linear infinite; }
    @keyframes mp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    /* Info (name + artist) — row 1, còn lại flex */
    #mpPlayer .mp-info { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; flex: 1; }
    #mpPlayer .mp-name {
      font-size: 14px; color: var(--neon);
      text-shadow: 0 0 6px rgba(var(--neon-rgb), 0.4);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #mpPlayer .mp-meta {
      font-size: 11px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Progress bar — row 2, có flex:1 để dãn ra */
    #mpPlayer .mp-bar {
      flex: 1;
      height: 3px;
      background: rgba(var(--neon-rgb), 0.15);
      border-radius: 2px; overflow: hidden;
      flex-shrink: 1;
      min-width: 40px;
    }
    #mpPlayer .mp-bar-fill {
      height: 100%; width: 0;
      background: var(--neon);
      transition: width 0.2s linear;
    }
    #mpPlayer .mp-time {
      font-size: 11px; color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    #mpPlayer .mp-btn {
      width: 24px; height: 24px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--neon);
      border-radius: 5px;
      cursor: pointer;

  <script>
    // ====================== FPS Counter (gộp chung 1 box duy nhất) ======================
    (function () {
      // Bỏ qua nếu đã có #fps-box từ markup tĩnh <div id="fps-box"> ở body
      let box = document.getElementById('fps-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'fps-box';
        box.title = 'FPS';
        document.body.appendChild(box);
      }
      var alpha = 0.1;
      var lastTime = performance.now();
      var smoothedFps = 60;
      var lastTextUpdate = 0;

      function loop(now) {
        var dt = now - lastTime;
        lastTime = now;
        if (dt > 0) {
          // EMA smoothing với alpha=0.1 → phản hồi nhanh nhưng ổn định
          var instant = 1000 / dt;
          smoothedFps = smoothedFps + alpha * (instant - smoothedFps);
        }
        if (now - lastTextUpdate >= 200) {
          // Clamp về [0, 144] để tránh hiển thị 600+ khi tab inactive rồi refocus
          var fps = Math.max(0, Math.min(144, Math.round(smoothedFps)));
          var color = fps >= 55 ? '#39ff14' : fps >= 30 ? '#ffdd00' : '#ff4040';
          box.style.color = color;
          box.textContent = 'FPS ' + fps;
          lastTextUpdate = now;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();

    // ====================== Rain Effect ======================
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let drops = [];
    let rainEnabled = true;
    let heavyRain = false;
    let rainOpacity = 0.5;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Drop {
      constructor() {
        this.reset();
        this.y = Math.random() * canvas.height;
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = heavyRain ? -20 : -10;
        this.len = heavyRain ? Math.random() * 30 + 20 : Math.random() * 15 + 8;
        this.speed = heavyRain ? Math.random() * 6 + 4 : Math.random() * 3 + 2;
        this.opacity = (Math.random() * 0.3 + 0.2) * rainOpacity;
        this.thick = heavyRain ? Math.random() * 1.5 + 1 : Math.random() * 0.8 + 0.4;
      }
      update() {
        this.y += this.speed;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + 1, this.y + this.len);
        // Đọc theme color động từ --neon-rgb (Front theme)
        var rgb = getComputedStyle(document.documentElement).getPropertyValue('--neon-rgb').trim() || '57, 255, 20';
        ctx.strokeStyle = 'rgba(' + rgb + ', ' + this.opacity + ')';
        ctx.lineWidth = this.thick;
        ctx.stroke();
      }
    }

    function initRain() {
      const count = heavyRain ? 150 : 60;
      drops = [];
      for (let i = 0; i < count; i++) drops.push(new Drop());
    }
    function animateRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (rainEnabled) drops.forEach(d => { d.update(); d.draw(); });
      requestAnimationFrame(animateRain);
    }
    initRain();
    animateRain();

    // ====================== Settings ======================
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    const closeSettings = document.getElementById('closeSettings');
    const overlay = document.getElementById('overlay');

    settingsBtn.addEventListener('click', () => {
      settingsMenu.classList.toggle('open');
      overlay.classList.toggle('active');
    });
    closeSettings.addEventListener('click', () => {
      settingsMenu.classList.remove('open');
      overlay.classList.remove('active');
    });
    overlay.addEventListener('click', () => {
      settingsMenu.classList.remove('open');
      overlay.classList.remove('active');
    });

    // Theme colors map
    const themes = {
      green: { neon: '#80ff40', neonRgb: '57, 255, 20', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#06060e' },
      cyan: { neon: '#00f0ff', neonRgb: '0, 240, 255', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#000e1a' },
      pink: { neon: '#ff2d7b', neonRgb: '255, 45, 123', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0610' },
      lavender: { neon: '#b388ff', neonRgb: '179, 136, 255', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#08060e' },
      yellow: { neon: '#f0e040', neonRgb: '240, 224, 64', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0c06' },
      red: { neon: '#ff4444', neonRgb: '255, 68, 68', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0606' },
      orange: { neon: '#ff8800', neonRgb: '255, 136, 0', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0a06' },
      white: { neon: '#eeeeee', neonRgb: '238, 238, 238', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#111111' }
    };

    function applyTheme(name) {
      const t = themes[name];
      if (!t) return;
      const r = document.documentElement;
      r.style.setProperty('--neon', t.neon);
      r.style.setProperty('--neon-rgb', t.neonRgb);
      r.style.setProperty('--neon-pink', t.neonPink);
      r.style.setProperty('--neon-pink-rgb', t.neonPinkRgb);
      r.style.setProperty('--neon-cyan', t.neonCyan);
      r.style.setProperty('--neon-cyan-rgb', t.neonCyanRgb);
      r.style.setProperty('--neon-yellow', t.neonYellow);
      r.style.setProperty('--neon-lavender', t.neonLavender);
      r.style.setProperty('--bg', t.bg);
      r.style.setProperty('--border', `rgba(${t.neonRgb}, 0.15)`);
      r.style.setProperty('--border-glow', `rgba(${t.neonRgb}, 0.38)`);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.theme-btn[data-theme="${name}"]`).classList.add('active');
      localStorage.setItem('blog_theme', name);
      // TÁCH BIỆT: Blog chỉ ghi blog_theme.
      // KHÔNG đụng repo_theme (Front repo) / dash_theme (Dashboard).
    }

    // ĐỒNG BỘ theme với Front Repo: Blog sẽ đọc `repo_theme` từ localStorage
    // (key mà Front Repo sử dụng) và apply theme tương ứng.
    // Mặc định là 'green' nếu chưa có.
    (function syncFrontThemeOnBlog() {
      const frontTheme = localStorage.getItem('repo_theme') || 'green';
      if (themes[frontTheme]) {
        applyTheme(frontTheme);
      } else {
        applyTheme('green');
      }
      // Lắng nghe thay đổi theme từ Front tab khác
      window.addEventListener('storage', function(e) {
        if (e.key === 'repo_theme' && e.newValue && themes[e.newValue]) {
          applyTheme(e.newValue);
        }
      });
    })();
    // Migrate key cũ sang key chung để sync với Front Repo.
    if (localStorage.getItem('blog_rainEnabled') !== null && localStorage.getItem('rainEnabled') === null) {
      localStorage.setItem('rainEnabled', localStorage.getItem('blog_rainEnabled'));
      localStorage.removeItem('blog_rainEnabled');
    }
    if (localStorage.getItem('blog_heavyRain') !== null && localStorage.getItem('heavyRain') === null) {
      localStorage.setItem('heavyRain', localStorage.getItem('blog_heavyRain'));
      localStorage.removeItem('blog_heavyRain');
    }
    if (localStorage.getItem('blog_darkMode') !== null && localStorage.getItem('darkMode') === null) {
      localStorage.setItem('darkMode', localStorage.getItem('blog_darkMode'));
      localStorage.removeItem('blog_darkMode');
    }

    // Rain toggle — đồng bộ key với Front Repo (`rainEnabled` thay vì
    // `blog_rainEnabled`) để cả 2 trang dùng chung setting khi user mở cả 2 tab.
    const toggleRainEl = document.getElementById('toggleRain');
    toggleRainEl.addEventListener('change', e => {
      rainEnabled = e.target.checked;
      // Ghi localStorage TRƯỚC rồi mới bridge sang blog_audio.js
      // (blog_audio.js sẽ đọc lại từ localStorage → sync state chính xác)
      localStorage.setItem('rainEnabled', String(rainEnabled));
      window.__blogRainOn = rainEnabled;
      try { window.__blogSyncRain && window.__blogSyncRain(); } catch (err) {}
    });
    const toggleHeavyRainEl = document.getElementById('toggleHeavyRain');
    toggleHeavyRainEl.addEventListener('change', e => {
      heavyRain = e.target.checked;
      console.log('[blog.html] toggleHeavyRain change →', heavyRain);
      localStorage.setItem('heavyRain', String(heavyRain));
      initRain();
      window.__blogHeavyOn = heavyRain;
      try { window.__blogSyncRain && window.__blogSyncRain(); } catch (err) {}
    });

    // Dark mode toggle - FIX
    function applyDarkMode(isDark) {
      if (isDark) {
        document.documentElement.style.setProperty('--panel', `rgba(10, 14, 26, var(--panel-alpha, 0.92))`);
        document.documentElement.style.setProperty('--panel-alt', 'rgba(6, 9, 18, 0.96)');
        document.documentElement.style.setProperty('--text', '#c0d8cc');
        document.documentElement.style.setProperty('--text-bright', '#e8fff0');
        document.documentElement.style.setProperty('--muted', '#7a9a86');
      } else {
        document.documentElement.style.setProperty('--panel', `rgba(240, 240, 245, var(--panel-alpha, 0.92))`);
        document.documentElement.style.setProperty('--panel-alt', 'rgba(255, 255, 255, 0.96)');
        document.documentElement.style.setProperty('--text', '#2a2a3a');
        document.documentElement.style.setProperty('--text-bright', '#0a0a1a');
        document.documentElement.style.setProperty('--muted', '#888899');
      }
    }
    document.getElementById('toggleDarkMode').addEventListener('change', e => {
      const isDark = e.target.checked;
      applyDarkMode(isDark);
      // Lưu preference dùng key CHUNG với Front Repo (`darkMode`) để sync
      // giữa 2 trang khi user mở cả 2 tab.
      localStorage.setItem('darkMode', isDark ? 'true' : 'false');
    });

    // Transparency - FIX: updates panel-alpha so ALL panel usages update
    document.getElementById('rangeTransparency').addEventListener('input', e => {
      const v = e.target.value / 100;
      document.documentElement.style.setProperty('--panel-alpha', v.toFixed(2));
      const isDark = localStorage.getItem('blog_darkMode') !== 'false';
      if (isDark) {
        document.documentElement.style.setProperty('--panel', `rgba(10, 14, 26, ${v})`);
        document.documentElement.style.setProperty('--panel-alt', `rgba(6, 9, 18, ${Math.min(v + 0.04, 1).toFixed(2)})`);
      } else {
        document.documentElement.style.setProperty('--panel', `rgba(240, 240, 245, ${v})`);
        document.documentElement.style.setProperty('--panel-alt', `rgba(255, 255, 255, ${Math.min(v + 0.04, 1).toFixed(2)})`);
      }
      localStorage.setItem('blog_transparency', e.target.value);
    });

    // Load saved settings
    function loadSavedSettings() {
      // Theme đã bị ẩn → luôn giữ mặc định green từ :root.

      // Dark mode — DEFAULT DARK on first visit (no saved key).
      // Dùng key CHUNG với Front Repo (`darkMode`) để sync giữa 2 tab.
      // savedDark có thể là 'true', 'false', boolean true/false, hoặc null.
      // Mặc định dark (true). Chỉ light khi rõ ràng là false.
      const savedDark = localStorage.getItem('darkMode');
      const initialDark = (savedDark !== false && savedDark !== 'false');
      document.getElementById('toggleDarkMode').checked = initialDark;
      applyDarkMode(initialDark);

      // Transparency — chỉ dùng riêng cho blog (không sync với Front).
      const savedTrans = localStorage.getItem('blog_transparency') || '92';
      document.getElementById('rangeTransparency').value = savedTrans;
      const v = parseInt(savedTrans) / 100;
      document.documentElement.style.setProperty('--panel-alpha', v.toFixed(2));
      const isDark = localStorage.getItem('darkMode') !== 'false';
      if (isDark) {
        document.documentElement.style.setProperty('--panel', `rgba(10, 14, 26, ${v})`);
      } else {
        document.documentElement.style.setProperty('--panel', `rgba(240, 240, 245, ${v})`);
      }

      // Rain — dùng key CHUNG với Front Repo (`rainEnabled`, `heavyRain`).
      if (localStorage.getItem('rainEnabled') === 'false') {
        rainEnabled = false;
        document.getElementById('toggleRain').checked = false;
      }
      if (localStorage.getItem('heavyRain') === 'true') {
        heavyRain = true;
        document.getElementById('toggleHeavyRain').checked = true;
        initRain();
      }
    }
    loadSavedSettings();

    // Cross-tab sync: nếu user mở cả Front Repo lẫn Blog, toggle ở trang này
    // sẽ cập nhật trang kia theo thời gian thực.
    window.addEventListener('storage', e => {
      if (e.key === 'rainEnabled') {
        rainEnabled = e.newValue !== 'false';
        const el = document.getElementById('toggleRain');
        if (el) el.checked = rainEnabled;
      } else if (e.key === 'heavyRain') {
        heavyRain = e.newValue === 'true';
        const el = document.getElementById('toggleHeavyRain');
        if (el) el.checked = heavyRain;
        initRain();
      } else if (e.key === 'darkMode') {
        const isDark = (e.newValue !== 'false' && e.newValue !== null);
        document.getElementById('toggleDarkMode').checked = isDark;
        applyDarkMode(isDark);
      }
    });

    // ====================== Blog Logic ======================
    let allPosts = [];
    let currentPage = 1;
    const pageSize = 5;

    async function loadPosts() {
      try {
        // GH Pages / public mode: dùng data bake-in trong window.PUBLIC_REPO_DATA
        if (window.PUBLIC_MODE && window.PUBLIC_REPO_DATA) {
          allPosts = window.PUBLIC_REPO_DATA.blog || [];
        } else {
          // Thử server trước (source of truth), nếu lỗi / rỗng → localStorage
          try {
            const res = await (window.PUBLIC_MODE ? Promise.resolve({posts: (window.PUBLIC_REPO_DATA?.blog || [])}) : fetch('/api/blog/posts'));
            const data = await res.json();
            if (data && data.posts && data.posts.length > 0) {
              allPosts = data.posts;
            } else {
              const savedPosts = localStorage.getItem('repo_blogPosts');
              if (savedPosts) {
                allPosts = JSON.parse(savedPosts);
              } else {
                allPosts = data.posts || [];
              }
            }
          } catch(e) {
            const savedPosts = localStorage.getItem('repo_blogPosts');
            if (savedPosts) {
              allPosts = JSON.parse(savedPosts);
            } else {
              throw e;
            }
          }
        }
        renderBlog();
      } catch (e) {
        document.getElementById('blogContent').innerHTML = '<p style="color:var(--neon-pink);padding:20px;">Loi tai bai viet</p>';
      }
    }

    // Lắng nghe broadcast từ Dashboard khi Blog CRUD thay đổi
    try {
      if (window.BroadcastChannel) {
        const bc = new BroadcastChannel('repo_blog');
        bc.addEventListener('message', function(ev) {
          if (ev.data && ev.data.type === 'updated') {
            loadPosts();
          }
        });
      }
    } catch(e) {}
    // storage event từ tab khác cũng trigger reload
    window.addEventListener('storage', function(e) {
      if (e.key === 'repo_blog_updated' || e.key === 'repo_blogPosts') {
        loadPosts();
      }
    });

    function getUrlPostId() {
      // Accept 3 dạng URL:
      //  - /blog-post/<id>         (Flask admin route, local)
      //  - /blog/<id>              (Flask admin alias)
      //  - blog.html?id=<id>       (GH Pages — Flask không có, query string thay thế)
      let m = location.pathname.match(/\/blog(?:-post)?\/(\d+)/);
      if (m) return parseInt(m[1]);
      const qs = new URLSearchParams(location.search);
      const id = qs.get('id');
      return id ? parseInt(id, 10) : null;
    }

    function renderBlog() {
      const postId = getUrlPostId();
      if (postId) {
        // Đang đọc bài viết → tắt text-shadow trên body để chữ không bị nhòe
        document.body.classList.add('reading-mode');
        renderPost(postId);
      } else {
        document.body.classList.remove('reading-mode');
        renderList();
      }
    }

    function renderList() {
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pagePosts = allPosts.slice(start, end);
      const totalPages = Math.ceil(allPosts.length / pageSize);

      let html = '<div class="blog-list">';
      for (const p of pagePosts) {
        // FIX: Open in NEW TAB instead of same page navigation.
        // Ở public mode (GH Pages) → dùng ?id= cùng file blog.html.
        // Ở local admin → Flask endpoint /blog-post/<id>.
        const _postHref = window.PUBLIC_MODE
          ? `./blog.html?id=${encodeURIComponent(p.id)}`
          : `/blog-post/${encodeURIComponent(p.id)}`;
        html += `
          <a href="${_postHref}" target="_blank" class="blog-card">
            <div class="blog-card-icon">${p.icon}</div>
            <div class="blog-card-content">
              <div class="blog-card-title">${p.title}</div>
              <div class="blog-card-meta">
                <span>&#128197; ${p.date}</span>
              </div>
              <div class="blog-card-excerpt">${p.excerpt || ''}</div>
            </div>
            <div class="blog-card-arrow">&#8594;</div>
          </a>`;
      }
      html += '</div>';

      // Pagination
      if (totalPages > 1) {
        html += '<div class="blog-pagination">';
        html += `<a href="#" class="page-btn" onclick="goPage(${currentPage - 1});return false;" ${currentPage === 1 ? 'disabled' : ''}>&#8592;</a>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<a href="#" class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i});return false;">${i}</a>`;
        }
        html += `<a href="#" class="page-btn" onclick="goPage(${currentPage + 1});return false;" ${currentPage === totalPages ? 'disabled' : ''}>&#8594;</a>`;
        html += '</div>';
      }

      document.getElementById('blogContent').innerHTML = html;
    }

    function renderPost(postId) {
      const post = allPosts.find(p => p.id === postId);
      if (!post) {
        document.getElementById('blogContent').innerHTML = `
          <div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:40px;text-align:center;">
            <div style="font-size:48px;margin-bottom:16px;">&#128533;</div>
            <p style="color:var(--neon-pink);font-size:16px;margin-bottom:12px;">Bai viet khong ton tai</p>
            <a href="./blog.html" class="back-btn" style="display:inline-flex;text-decoration:none;"><svg class="back-arrow" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11 3 L4 8 L11 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Quay lai danh sach</a>
          </div>`;
        return;
      }
      // Render hero image (cover) nếu post.image tồn tại
      const heroImg = post.image
        ? `<img class="post-hero-img" src="${post.image}" alt="${post.title}" loading="lazy">`
        : '';
      // Render gallery: post.images là array các URL ảnh phụ trong bài viết
      let galleryHtml = '';
      if (Array.isArray(post.images) && post.images.length) {
        galleryHtml = '<div class="image-gallery">' +
          post.images.map(src => `<img src="${src}" alt="" loading="lazy">`).join('') +
          '</div>';
      }
      document.getElementById('blogContent').innerHTML = `
        <div class="post-detail">
          <div class="post-header">
            <a href="./blog.html" class="post-back-link"><svg class="back-arrow" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11 3 L4 8 L11 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg> Quay lai danh sach bai viet</a>
            ${heroImg}
            <div class="post-icon-big">${post.icon}</div>
            <h1 class="post-title">${post.title}</h1>
            <div class="post-meta">
              <span>&#128197; ${post.date}</span>
              <span>&#128221; ${allPosts.length} bai viet</span>
            </div>
          </div>
          <div class="post-body">
            ${galleryHtml}
            ${post.content || '<p>Noi dung dang duoc cap nhat...</p>'}
          </div>
        </div>`;
    }

    function goPage(page) {
      currentPage = page;
      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadPosts();
  </script>

  <!-- Rain audio containers (multi-source: MP3 / YouTube / Spotify) -->
  <div id="blog-rain-yt-host" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
  <div id="blog-rain-heavy-yt-host" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
  <audio id="blogRainAudio"       loop preload="auto" style="display:none;"></audio>
  <audio id="blogRainHeavyAudio"  loop preload="auto" style="display:none;"></audio>

  <!-- Now Playing mini player (góc dưới phải, đồng bộ với Front repo) -->
  <!-- Layout 2 hàng:
       Row 1: Disc + Name/Artist (info text)
       Row 2: Progress bar + Time + Buttons -->
  <div id="mpPlayer" class="mp-player">
    <div class="mp-row mp-row-top">
      <div class="mp-disc" id="mpBigCover"></div>
      <div class="mp-info">
        <div class="mp-name" id="mpTitle">&mdash;</div>
        <div class="mp-meta" id="mpArtist"></div>
      </div>
    </div>
    <div class="mp-row mp-row-bot">
      <div class="mp-bar"><div class="mp-bar-fill" id="mpBarFill"></div></div>
      <div class="mp-time"><span id="mpCur">0:00</span> <span id="mpDur">0:00</span></div>
      <!-- Same SVG icons as Front repo (.mp-btn-mini) -->
      <button id="mpPrev" class="mp-btn mp-btn-mini" title="Bài trước" aria-label="Bài trước">
        <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg"><path d="M5 0.5 L1 4 L5 7.5 Z M6 0.5 H7 V7.5 H6 Z"/></svg>
      </button>
      <button id="mpPlay" class="mp-btn" title="Phát" aria-label="Phát / Dừng">
        <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg"><path d="M2 1 L7 4 L2 7 Z"/></svg>
      </button>
      <button id="mpNext" class="mp-btn mp-btn-mini" title="Bài sau" aria-label="Bài sau">
        <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg"><path d="M3 0.5 L7 4 L3 7.5 Z M1 0.5 H2 V7.5 H1 Z"/></svg>
      </button>
      <button id="mpLoop" class="mp-btn mp-btn-mini" title="Lặp lại (BẬT)" aria-label="Lặp lại" aria-pressed="true">
        <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg"><path d="M1.5 4 A2.5 2.5 0 0 1 4 1.5 H6.5 V0.5 L8 2 L6.5 3.5 V2.5 H4 A1.5 1.5 0 0 0 2.5 4 H1.5 Z M6.5 4 A2.5 2.5 0 0 1 4 6.5 H1.5 V7.5 L0 6 L1.5 4.5 V5.5 H4 A1.5 1.5 0 0 0 5.5 4 H6.5 Z"/></svg>
      </button>
      <button id="mpVolumeBtn" class="mp-btn mp-btn-mini" title="Âm lượng" aria-label="Âm lượng" aria-pressed="false">
        <svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg"><path d="M1 3 H2.5 L4.5 1 V7 L2.5 5 H1 Z M5.5 2.5 Q6.5 4 5.5 5.5 M6 1.5 Q8 4 6 6.5" fill="none" stroke="currentColor" stroke-width="0.6"/></svg>
      </button>
    </div>
    <div id="mpVolumePanel">
      <input type="range" id="mpVolumeRange" min="0" max="100" value="80">
      <span id="mpVolumeVal">80</span>
    </div>
  </div>
  <div id="mp-yt-host" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
  <div id="mp-spotify-host" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;"></div>
  <audio id="mpAudio" preload="auto" style="display:none;"></audio>

  <!-- Audio glue: rain audio + music player (uses TrackPlayer from multi_player.js) -->
  <script src="./static/multi_player.js?v=1"></script>
  <script src="./static/blog_audio.js?v=1"></script>
</body>
</html>
