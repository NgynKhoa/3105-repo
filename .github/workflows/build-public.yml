name: Build & Deploy Public (GitHub Pages)

on:
  push:
    branches: [main]
    # Chỉ rebuild khi các file ảnh hưởng tới public build thay đổi.
    paths:
      - 'repositories/**'
      - 'admin/templates/index.html'
      - 'admin/templates/_blog_posts.json'
      - 'admin/static/**'
      - 'tools/build_public.py'
      - '.3105/admin-settings.json'
      - '.3105/sync_state.json'
      - 'assets/**'
      - '.github/workflows/build-public.yml'
  workflow_dispatch:

# Đủ quyền để build artifact + deploy qua Pages API + OIDC cho Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh 2 deploy cùng lúc — giữ deploy cũ, skip deploy mới.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cài PyYAML
        run: pip install pyyaml

      - name: Build phiên bản public
        run: python tools/build_public.py

      - name: Kiểm tra output
        run: |
          echo "===== public/ structure ====="
          ls -la public/
          echo "===== packages count ====="
          python -c "import json; d = json.load(open('public/repo.json')); print('packages:', len(d['data']['packages']), 'blog:', len(d['data']['blog']))"
          echo "===== assets count ====="
          find public/assets -type f | wc -l
          echo "===== HTML size ====="
          wc -c public/index.html

      - name: Upload artifact cho GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
