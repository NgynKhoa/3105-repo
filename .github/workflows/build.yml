name: Auto Convert YAML to JSON

on:
  push:
    paths:
      - "repositories/demo/repo.yml"

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code về máy chủ
        uses: actions/checkout@v4

      - name: Cài đặt Python và PyYAML
        run: |
          python3 -m pip install pyyaml

      - name: Dịch file repo.yml sang repo.json trong repositories/demo
        run: |
          python3 -c "import yaml, json; json.dump(yaml.safe_load(open('repositories/demo/repo.yml', encoding='utf-8')), open('repositories/demo/repo.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)"

      - name: Tự động commit và push repo.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repositories/demo/repo.json
          git commit -m "chore: auto-build demo repo.json from repo.yml [skip ci]" || exit 0
          git push
