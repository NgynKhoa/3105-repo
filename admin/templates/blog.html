<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Blog — 3105 Mod Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fira+Code:wght@400;500&family=Be+Vietnam+Pro:wght@300;400;500;600&family=VT323&display=swap" rel="stylesheet" />
  <style>
    /* === FPS overlay widget === */
    #fps-box {
      position: fixed;
      top: 6px;
      left: 6px;
      z-index: 999999;
      padding: 0;
      font-family: 'VT323', 'Fira Code', monospace;
      font-size: 14px;
      line-height: 1;
      color: #39ff14;
      background: transparent;
      border: none;
      pointer-events: none;
      text-shadow: 0 0 4px currentColor;
      letter-spacing: 1px;
      user-select: none;
    }

    /* ============================ CSS VARIABLES ============================ */
    :root {
      --neon: #80ff40;
      --neon-rgb: 57, 255, 20;
      --neon-pink: #ff2d7b;
      --neon-pink-rgb: 255, 45, 123;
      --neon-cyan: #00f0ff;
      --neon-cyan-rgb: 0, 240, 255;
      --neon-yellow: #f0e040;
      --neon-lavender: #b388ff;
      --bg: #06060e;
      --panel: rgba(10, 14, 26, 0.92);
      --panel-alt: rgba(6, 9, 18, 0.96);
      --panel-soft: rgba(10, 14, 26, 0.06);
      --text: #c0d8cc;
      --text-bright: #e8fff0;
      --muted: #7a9a86;
      --border: rgba(57, 255, 20, 0.15);
      --border-glow: rgba(57, 255, 20, 0.38);
      --shadow: 0 0 14px rgba(0,0,0,0.4), 0 0 28px rgba(var(--neon-rgb),0.08);
      --inset: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    /* ============================ RESET & BASE ============================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Be Vietnam Pro', 'Fira Code', 'Courier New', monospace;
      min-height: 100vh;
      text-shadow: 0 0 4px rgba(232,255,240,0.3), 0 0 8px rgba(var(--neon-rgb),0.1);
      overflow-x: hidden;
      position: relative;
    }

    /* CRT scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.04) 2px,
        rgba(0, 0, 0, 0.04) 4px
      );
    }

    /* Background grid */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0 1px, transparent 1px 44px),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.016) 3px, rgba(255,255,255,0.016) 4px),
        radial-gradient(circle at 15% 8%, rgba(0,240,255,0.06), transparent 28%),
        radial-gradient(circle at 85% 4%, rgba(255,45,123,0.05), transparent 22%);
    }

    /* ============================ RAIN EFFECT ============================ */
    #rain-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ============================ LAYOUT ============================ */
    .page-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ============================ HEADER ============================ */
    .page-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--neon);
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
      text-decoration: none;
    }
    .back-btn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 10px rgba(var(--neon-rgb),0.3);
      transform: translateX(-2px);
    }
    .page-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: var(--neon);
      text-shadow: 0 0 8px rgba(var(--neon-rgb),0.5), 0 0 20px rgba(var(--neon-rgb),0.2);
      letter-spacing: 1px;
    }
    .page-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    /* ============================ BLOG LIST ============================ */
    .blog-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .blog-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .blog-card:hover {
      border-color: var(--border-glow);
      box-shadow: var(--shadow);
      transform: translateX(4px);
      background: rgba(10, 14, 26, 0.98);
    }
    .blog-card-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-alt);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .blog-card-content {
      flex: 1;
      min-width: 0;
    }
    .blog-card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .blog-card-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .blog-card-excerpt {
      font-size: 13px;
      color: var(--text);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .blog-card-arrow {
      color: var(--neon);
      font-size: 18px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .blog-card:hover .blog-card-arrow {
      opacity: 1;
    }

    /* ============================ SINGLE POST ============================ */
    .post-detail {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .post-header {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(var(--neon-rgb),0.04) 0%, transparent 100%);
    }
    .post-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--neon);
      text-decoration: none;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .post-back-link:hover {
      text-shadow: 0 0 8px rgba(var(--neon-rgb),0.5);
    }
    .post-icon-big {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .post-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: var(--text-bright);
      line-height: 1.6;
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(var(--neon-rgb),0.3);
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
    }
    .post-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .post-body {
      padding: 28px;
      line-height: 1.8;
      font-size: 14px;
    }
    .post-body h2 {
      color: var(--neon);
      font-size: 16px;
      margin: 24px 0 12px;
      text-shadow: 0 0 8px rgba(var(--neon-rgb),0.4);
    }
    .post-body h2:first-child { margin-top: 0; }
    .post-body h3 {
      color: var(--neon-cyan);
      font-size: 14px;
      margin: 20px 0 10px;
    }
    .post-body p {
      margin-bottom: 14px;
      color: var(--text);
    }
    .post-body ul, .post-body ol {
      margin: 12px 0 16px 20px;
    }
    .post-body li {
      margin-bottom: 8px;
      color: var(--text);
    }
    .post-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13px;
    }
    .post-body th, .post-body td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      text-align: left;
    }
    .post-body th {
      background: rgba(var(--neon-rgb),0.06);
      color: var(--neon);
    }
    .post-body tr:hover td {
      background: rgba(var(--neon-rgb),0.03);
    }
    .post-body strong {
      color: var(--neon-yellow);
    }
    .post-body em {
      color: var(--neon-cyan);
      font-style: normal;
    }

    /* ============================ PAGINATION ============================ */
    .blog-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
      padding: 16px;
      border-top: 1px solid var(--border);
    }
    .page-btn {
      min-width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .page-btn:hover, .page-btn.active {
      border-color: var(--neon);
      color: var(--neon);
      box-shadow: 0 0 10px rgba(var(--neon-rgb),0.25);
    }
    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* ============================ SETTINGS BUTTON ============================ */
    #settingsBtn {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10000;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--neon);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    #settingsBtn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 14px rgba(var(--neon-rgb),0.35);
      transform: rotate(30deg);
    }

    /* ============================ SETTINGS MENU ============================ */
    #settingsMenu {
      display: none;
      position: fixed;
      top: 60px;
      right: 14px;
      z-index: 10001;
      width: 260px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    #settingsMenu.open { display: block; }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: rgba(var(--neon-rgb),0.04);
    }
    .settings-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: var(--neon);
      text-shadow: 0 0 6px rgba(var(--neon-rgb),0.4);
    }
    .settings-close {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .settings-close:hover {
      color: var(--neon-pink);
      background: rgba(var(--neon-pink-rgb),0.1);
    }
    .settings-body {
      padding: 8px 0;
      max-height: 60vh;
      overflow-y: auto;
    }
    .settings-group {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .settings-group:last-child { border-bottom: none; }
    .settings-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-row-label {
      font-size: 12px;
      color: var(--text);
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: var(--muted);
      border-radius: 50%;
      transition: all 0.2s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background: rgba(var(--neon-rgb),0.2);
      border-color: var(--neon);
    }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: var(--neon);
      box-shadow: 0 0 8px rgba(var(--neon-rgb),0.5);
    }
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .theme-btn {
      height: 36px;
      border: 2px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-btn:hover { transform: scale(1.05); }
    .theme-btn.active { border-color: var(--neon); box-shadow: 0 0 10px rgba(var(--neon-rgb),0.3); }
    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--neon);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(var(--neon-rgb),0.5);
    }

    /* ============================ OVERLAY ============================ */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: transparent;
    }
    #overlay.active { display: block; }
  </style>
</head>
<body>
  <canvas id="rain-canvas"></canvas>
  <div id="fps-box">FPS: --</div>

  <!-- Settings Button -->
  <button id="settingsBtn" title="Cài đặt">⚙️</button>

  <!-- Settings Menu -->
  <div id="settingsMenu">
    <div class="settings-header">
      <span class="settings-title">SETTINGS</span>
      <button class="settings-close" id="closeSettings">✕</button>
    </div>
    <div class="settings-body">
      <!-- Theme Color -->
      <div class="settings-group">
        <span class="settings-label">Màu Theme</span>
        <div class="theme-grid" id="themeGrid">
          <button class="theme-btn active" data-theme="green" style="background: linear-gradient(135deg,#80ff40,#39ff14);" title="Green Neon"></button>
          <button class="theme-btn" data-theme="cyan" style="background: linear-gradient(135deg,#00f0ff,#0099cc);" title="Cyan Neon"></button>
          <button class="theme-btn" data-theme="pink" style="background: linear-gradient(135deg,#ff2d7b,#cc1155);" title="Pink Neon"></button>
          <button class="theme-btn" data-theme="lavender" style="background: linear-gradient(135deg,#b388ff,#7744dd);" title="Lavender"></button>
          <button class="theme-btn" data-theme="yellow" style="background: linear-gradient(135deg,#f0e040,#ccbb00);" title="Yellow Neon"></button>
          <button class="theme-btn" data-theme="red" style="background: linear-gradient(135deg,#ff4444,#cc0000);" title="Red"></button>
          <button class="theme-btn" data-theme="orange" style="background: linear-gradient(135deg,#ff8800,#cc5500);" title="Orange"></button>
          <button class="theme-btn" data-theme="white" style="background: linear-gradient(135deg,#ffffff,#cccccc);" title="White"></button>
        </div>
      </div>

      <!-- Rain Effects -->
      <div class="settings-group">
        <span class="settings-label">Hiệu ứng Mưa</span>
        <div class="settings-row">
          <span class="settings-row-label">Bật Mưa</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleRain" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row">
          <span class="settings-row-label">Mưa Nặng</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleHeavyRain">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Dark Mode -->
      <div class="settings-group">
        <span class="settings-label">Chế độ Hiển thị</span>
        <div class="settings-row">
          <span class="settings-row-label">Dark Mode</span>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleDarkMode" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Transparency -->
      <div class="settings-group">
        <span class="settings-label">Độ Trong Suốt</span>
        <input type="range" id="rangeTransparency" min="0" max="100" value="92">
      </div>
    </div>
  </div>

  <div id="overlay"></div>

  <div class="page-wrapper">
    <header class="page-header">
      <a href="/" class="back-btn" title="Quay lại">←</a>
      <span class="page-icon">📝</span>
      <h1 class="page-title">BLOG</h1>
    </header>

    <div id="blogContent"></div>
  </div>

  <script>
    // ====================== FPS Counter ======================
    (function() {
      let last = performance.now();
      let frames = 0;
      const fpsBox = document.getElementById('fps-box');
      function loop() {
        frames++;
        const now = performance.now();
        if (now - last >= 1000) {
          fpsBox.textContent = 'FPS: ' + frames;
          frames = 0;
          last = now;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();

    // ====================== Rain Effect ======================
    const canvas = document.getElementById('rain-canvas');
    const ctx = canvas.getContext('2d');
    let drops = [];
    let rainEnabled = true;
    let heavyRain = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Drop {
      constructor() {
        this.reset();
        this.y = Math.random() * canvas.height;
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = heavyRain ? -20 : -10;
        this.len = heavyRain ? Math.random() * 30 + 20 : Math.random() * 15 + 8;
        this.speed = heavyRain ? Math.random() * 6 + 4 : Math.random() * 3 + 2;
        this.opacity = Math.random() * 0.3 + 0.2;
        this.thick = heavyRain ? Math.random() * 1.5 + 1 : Math.random() * 0.8 + 0.4;
      }
      update() {
        this.y += this.speed;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + 1, this.y + this.len);
        ctx.strokeStyle = `rgba(57, 255, 20, ${this.opacity})`;
        ctx.lineWidth = this.thick;
        ctx.stroke();
      }
    }

    function initRain() {
      const count = heavyRain ? 150 : 60;
      drops = [];
      for (let i = 0; i < count; i++) drops.push(new Drop());
    }
    function animateRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (rainEnabled) {
        drops.forEach(d => { d.update(); d.draw(); });
      }
      requestAnimationFrame(animateRain);
    }
    initRain();
    animateRain();

    // ====================== Settings ======================
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    const closeSettings = document.getElementById('closeSettings');
    const overlay = document.getElementById('overlay');

    settingsBtn.addEventListener('click', () => {
      settingsMenu.classList.toggle('open');
      overlay.classList.toggle('active');
    });
    closeSettings.addEventListener('click', () => {
      settingsMenu.classList.remove('open');
      overlay.classList.remove('active');
    });
    overlay.addEventListener('click', () => {
      settingsMenu.classList.remove('open');
      overlay.classList.remove('active');
    });

    // Theme colors map
    const themes = {
      green: { neon: '#80ff40', neonRgb: '57, 255, 20', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#06060e' },
      cyan: { neon: '#00f0ff', neonRgb: '0, 240, 255', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#000e1a' },
      pink: { neon: '#ff2d7b', neonRgb: '255, 45, 123', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0610' },
      lavender: { neon: '#b388ff', neonRgb: '179, 136, 255', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#08060e' },
      yellow: { neon: '#f0e040', neonRgb: '240, 224, 64', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0c06' },
      red: { neon: '#ff4444', neonRgb: '255, 68, 68', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0606' },
      orange: { neon: '#ff8800', neonRgb: '255, 136, 0', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#0e0a06' },
      white: { neon: '#eeeeee', neonRgb: '238, 238, 238', neonPink: '#ff2d7b', neonPinkRgb: '255, 45, 123', neonCyan: '#00f0ff', neonCyanRgb: '0, 240, 255', neonYellow: '#f0e040', neonLavender: '#b388ff', bg: '#111111' }
    };

    function applyTheme(name) {
      const t = themes[name];
      if (!t) return;
      const r = document.documentElement;
      r.style.setProperty('--neon', t.neon);
      r.style.setProperty('--neon-rgb', t.neonRgb);
      r.style.setProperty('--neon-pink', t.neonPink);
      r.style.setProperty('--neon-pink-rgb', t.neonPinkRgb);
      r.style.setProperty('--neon-cyan', t.neonCyan);
      r.style.setProperty('--neon-cyan-rgb', t.neonCyanRgb);
      r.style.setProperty('--neon-yellow', t.neonYellow);
      r.style.setProperty('--neon-lavender', t.neonLavender);
      r.style.setProperty('--bg', t.bg);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.theme-btn[data-theme="${name}"]`).classList.add('active');
      localStorage.setItem('theme', name);
    }

    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
    });

    // Rain toggle
    document.getElementById('toggleRain').addEventListener('change', e => {
      rainEnabled = e.target.checked;
      localStorage.setItem('rainEnabled', rainEnabled);
    });
    document.getElementById('toggleHeavyRain').addEventListener('change', e => {
      heavyRain = e.target.checked;
      initRain();
      localStorage.setItem('heavyRain', heavyRain);
    });

    // Dark mode toggle
    document.getElementById('toggleDarkMode').addEventListener('change', e => {
      if (e.target.checked) {
        document.documentElement.style.setProperty('--panel', 'rgba(10, 14, 26, 0.92)');
        document.documentElement.style.setProperty('--panel-alt', 'rgba(6, 9, 18, 0.96)');
      } else {
        document.documentElement.style.setProperty('--panel', 'rgba(255, 255, 255, 0.92)');
        document.documentElement.style.setProperty('--panel-alt', 'rgba(240, 240, 240, 0.96)');
        document.documentElement.style.setProperty('--text', '#1a1a1a');
        document.documentElement.style.setProperty('--text-bright', '#000000');
        document.documentElement.style.setProperty('--muted', '#666666');
      }
      localStorage.setItem('darkMode', e.target.checked);
    });

    // Transparency
    document.getElementById('rangeTransparency').addEventListener('input', e => {
      const v = e.target.value / 100;
      document.documentElement.style.setProperty('--panel', `rgba(10, 14, 26, ${v})`);
      localStorage.setItem('transparency', e.target.value);
    });

    // Load saved settings
    if (localStorage.getItem('theme')) applyTheme(localStorage.getItem('theme'));
    if (localStorage.getItem('rainEnabled') === 'false') { rainEnabled = false; document.getElementById('toggleRain').checked = false; }
    if (localStorage.getItem('heavyRain') === 'true') { heavyRain = true; document.getElementById('toggleHeavyRain').checked = true; initRain(); }
    if (localStorage.getItem('darkMode') === 'false') document.getElementById('toggleDarkMode').checked = false;
    if (localStorage.getItem('transparency')) {
      const v = localStorage.getItem('transparency') / 100;
      document.documentElement.style.setProperty('--panel', `rgba(10, 14, 26, ${v})`);
      document.getElementById('rangeTransparency').value = localStorage.getItem('transparency');
    }

    // ====================== Blog Logic ======================
    let allPosts = [];
    let currentPage = 1;
    const pageSize = 5;

    async function loadPosts() {
      try {
        const res = await fetch('/api/blog/posts');
        const data = await res.json();
        allPosts = data.posts;
        renderBlog();
      } catch (e) {
        document.getElementById('blogContent').innerHTML = '<p style="color:var(--neon-pink);padding:20px;">Lỗi tải bài viết</p>';
      }
    }

    function getUrlPostId() {
      const m = location.pathname.match(/\/blog\/(\d+)/);
      return m ? parseInt(m[1]) : null;
    }

    function renderBlog() {
      const postId = getUrlPostId();
      if (postId) {
        renderPost(postId);
      } else {
        renderList();
      }
    }

    function renderList() {
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pagePosts = allPosts.slice(start, end);
      const totalPages = Math.ceil(allPosts.length / pageSize);

      let html = '<div class="blog-list">';
      for (const p of pagePosts) {
        html += `
          <a href="/blog/${p.id}" class="blog-card">
            <div class="blog-card-icon">${p.icon}</div>
            <div class="blog-card-content">
              <div class="blog-card-title">${p.title}</div>
              <div class="blog-card-meta">
                <span>📅 ${p.date}</span>
              </div>
              <div class="blog-card-excerpt">${p.excerpt}</div>
            </div>
            <div class="blog-card-arrow">→</div>
          </a>`;
      }
      html += '</div>';

      // Pagination
      if (totalPages > 1) {
        html += '<div class="blog-pagination">';
        html += `<a href="#" class="page-btn" onclick="goPage(${currentPage - 1});return false;" ${currentPage === 1 ? 'disabled' : ''}>←</a>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<a href="#" class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i});return false;">${i}</a>`;
        }
        html += `<a href="#" class="page-btn" onclick="goPage(${currentPage + 1});return false;" ${currentPage === totalPages ? 'disabled' : ''}>→</a>`;
        html += '</div>';
      }

      document.getElementById('blogContent').innerHTML = html;
    }

    async function renderPost(postId) {
      const post = allPosts.find(p => p.id === postId);
      if (!post) {
        document.getElementById('blogContent').innerHTML = '<p style="color:var(--neon-pink);padding:20px;">Bài viết không tồn tại</p><a href="/blog" style="color:var(--neon);padding:20px;">← Quay lại danh sách</a>';
        return;
      }
      document.getElementById('blogContent').innerHTML = `
        <div class="post-detail">
          <div class="post-header">
            <a href="/blog" class="post-back-link">← Quay lại danh sách bài viết</a>
            <div class="post-icon-big">${post.icon}</div>
            <h1 class="post-title">${post.title}</h1>
            <div class="post-meta">
              <span class="post-meta-item">📅 ${post.date}</span>
              <span class="post-meta-item">📝 ${allPosts.length} bài viết</span>
            </div>
          </div>
          <div class="post-body">${post.content}</div>
        </div>
      `;
    }

    function goPage(page) {
      currentPage = page;
      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadPosts();
  </script>
</body>
</html>
